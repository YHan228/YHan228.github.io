<script src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}

<!-- Theme Toggle Button -->
<button class="theme-toggle" id="theme-toggle-btn" type="button" aria-label="Toggle dark mode">
  <span id="theme-icon"></span>
</button>

<script>
(function() {
  // Icons
  var sunIcon = '\u25D0';  // ◐
  var moonIcon = '\u25D1'; // ◑

  // Get current theme
  function getTheme() {
    return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
  }

  // Set theme
  function setTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme === 'dark' ? 'dark' : '');
    localStorage.setItem('theme', theme);
    updateIcon();
  }

  // Update icon
  function updateIcon() {
    var icon = document.getElementById('theme-icon');
    if (icon) {
      icon.textContent = getTheme() === 'dark' ? moonIcon : sunIcon;
    }
  }

  // Toggle theme
  function toggleTheme() {
    var newTheme = getTheme() === 'dark' ? 'light' : 'dark';
    setTheme(newTheme);
  }

  // Load saved theme on page load (before DOM ready)
  var saved = localStorage.getItem('theme');
  if (saved === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  // Setup when DOM is ready
  document.addEventListener('DOMContentLoaded', function() {
    // Update icon to match current state
    updateIcon();

    // Attach click handler
    var btn = document.getElementById('theme-toggle-btn');
    if (btn) {
      btn.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();
        toggleTheme();
      });
    }

    // Masthead scroll effect
    var masthead = document.querySelector('.masthead');
    if (masthead) {
      var ticking = false;
      function updateMasthead() {
        if (window.scrollY > 10) {
          masthead.classList.add('scrolled');
        } else {
          masthead.classList.remove('scrolled');
        }
        ticking = false;
      }
      window.addEventListener('scroll', function() {
        if (!ticking) {
          requestAnimationFrame(updateMasthead);
          ticking = true;
        }
      }, { passive: true });
      updateMasthead();
    }
  });
})();
</script>
