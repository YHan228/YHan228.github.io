<script src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}

<!-- Theme Toggle Button -->
<button class="theme-toggle" aria-label="Toggle dark mode">
  <span class="theme-icon"></span>
</button>

<script>
// Simple dark mode toggle - no dependencies
(function() {
  var toggle = document.querySelector('.theme-toggle');
  var icon = toggle ? toggle.querySelector('.theme-icon') : null;

  function isDark() {
    return document.documentElement.getAttribute('data-theme') === 'dark';
  }

  function updateIcon() {
    if (icon) {
      icon.textContent = isDark() ? '\u263D' : '\u2600';
    }
  }

  function setTheme(dark) {
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : '');
    localStorage.setItem('theme', dark ? 'dark' : 'light');
    updateIcon();
  }

  // Load saved theme immediately
  if (localStorage.getItem('theme') === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  }

  // Set up click handler directly
  if (toggle) {
    toggle.onclick = function(e) {
      e.preventDefault();
      setTheme(!isDark());
    };
  }

  // Update icon on load
  updateIcon();

  // Masthead scroll effect
  var masthead = document.querySelector('.masthead');
  if (masthead) {
    var ticking = false;
    function updateMasthead() {
      if (window.scrollY > 10) {
        masthead.classList.add('scrolled');
      } else {
        masthead.classList.remove('scrolled');
      }
      ticking = false;
    }
    window.addEventListener('scroll', function() {
      if (!ticking) {
        requestAnimationFrame(updateMasthead);
        ticking = true;
      }
    }, { passive: true });
    updateMasthead();
  }
})();
</script>
