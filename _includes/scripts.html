<script src="{{ base_path }}/assets/js/main.min.js"></script>

{% include analytics.html %}

<!-- Theme Toggle Button (Floating) -->
<button class="theme-toggle" type="button" aria-label="Toggle dark mode">
  <svg class="theme-icon theme-icon--sun" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="5"></circle>
    <line x1="12" y1="1" x2="12" y2="3"></line>
    <line x1="12" y1="21" x2="12" y2="23"></line>
    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
    <line x1="1" y1="12" x2="3" y2="12"></line>
    <line x1="21" y1="12" x2="23" y2="12"></line>
    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
  </svg>
  <svg class="theme-icon theme-icon--moon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
  </svg>
</button>

<script>
(function() {
  'use strict';

  var html = document.documentElement;
  var toggle = document.querySelector('.theme-toggle');

  // Determine if dark mode is active
  function isDark() {
    return html.getAttribute('data-theme') === 'dark';
  }

  // Apply theme to DOM and persist to localStorage
  function applyTheme(dark) {
    if (dark) {
      html.setAttribute('data-theme', 'dark');
    } else {
      html.removeAttribute('data-theme');
    }
  }

  function saveTheme(dark) {
    try {
      localStorage.setItem('theme', dark ? 'dark' : 'light');
    } catch (e) {
      // localStorage might be unavailable
    }
  }

  // Initialize theme on page load
  function initTheme() {
    var saved = null;
    try {
      saved = localStorage.getItem('theme');
    } catch (e) {}

    if (saved === 'dark') {
      applyTheme(true);
    } else if (saved === 'light') {
      applyTheme(false);
    } else {
      // No saved preference - check browser preference
      if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        applyTheme(true);
      } else {
        applyTheme(false);
      }
    }
  }

  // Toggle theme
  function toggleTheme(e) {
    if (e) {
      e.preventDefault();
      e.stopPropagation();
    }
    var newDark = !isDark();
    applyTheme(newDark);
    saveTheme(newDark);
  }

  // Initialize theme immediately
  initTheme();

  // Set up click handler using addEventListener (more reliable than onclick)
  if (toggle) {
    toggle.addEventListener('click', toggleTheme, false);
    // Also handle touch for mobile
    toggle.addEventListener('touchend', function(e) {
      e.preventDefault();
      toggleTheme();
    }, { passive: false });
  }

  // Masthead scroll effect
  var masthead = document.querySelector('.masthead');
  if (masthead) {
    var scrollHandler = function() {
      if (window.scrollY > 10) {
        masthead.classList.add('scrolled');
      } else {
        masthead.classList.remove('scrolled');
      }
    };
    window.addEventListener('scroll', scrollHandler, { passive: true });
    // Run once on load
    scrollHandler();
  }
})();
</script>
